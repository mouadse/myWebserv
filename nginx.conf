# Sample config for tokenizer testing
server {
    listen 80;
    server_name example.com;
    root "/var/www/example site";
    # an empty quoted string:
    var "";
    location /images/ {
        types {
            jpg "image/jpeg";
            png "image/png";
        }
    }
    # this token has semicolons inside a quoted string; should be one token:
    note "a;b;c";
    user admin; # trailing comment after token
}
